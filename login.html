<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINPATH - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-chart-line"></i> FINPATH</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html" class="active">Login</a></li>
          <li><a href="register.html" class="btn-primary">Get Started</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fa-solid fa-lock auth-icon"></i>
        <h2>Account Login</h2>
        <p>Enter your credentials to access your FINPATH dashboard.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-key"></i> Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div id="authErrorMessage" class="error-message"></div>

        <button type="submit" class="btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </main>

</body>
</html>
